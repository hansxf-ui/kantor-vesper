<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kantor Vesper 🏢</title>
<style>
  :root {
    --bg: #14161f;
    --sheet: rgba(20, 22, 31, 0.92);
    --text: #eef0f6;
    --muted: #9aa0b4;
    --accent: #2dd4bf;
    --green: #34d399;
    --amber: #fbbf24;
    --slate: #94a3b8;
    --red: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #scene-container { position: fixed; inset: 0; }
  #scene-container canvas { display: block; }

  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--muted);
    font-size: 15px; text-align: center; padding: 24px;
    z-index: 30;
  }
  #loading.hidden { display: none; }

  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    max-height: 46vh;
    background: var(--sheet);
    backdrop-filter: blur(8px);
    border-top: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px 16px 0 0;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    overflow-y: auto;
    z-index: 20;
    transition: transform 0.3s ease;
  }
  #sheet.collapsed { transform: translateY(calc(100% - 62px)); }
  #sheet-handle {
    position: sticky; top: -12px; margin: -12px -16px 0; padding: 10px 0 8px;
    cursor: pointer; text-align: center; background: var(--sheet); z-index: 2;
  }
  #sheet-handle span {
    display: inline-block; width: 44px; height: 5px;
    border-radius: 999px; background: rgba(255,255,255,0.25);
  }
  #status-card { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  #agent-name { font-weight: 700; font-size: 17px; }
  #state-badge {
    font-size: 12px; font-weight: 700;
    padding: 3px 10px; border-radius: 999px;
    background: var(--slate); color: #10131a;
  }
  #state-badge.working { background: var(--green); }
  #state-badge.idle { background: var(--amber); }
  #state-badge.sleeping { background: var(--slate); }
  #activity-text { color: var(--muted); font-size: 13px; margin-top: 2px; }
  #updated-text { color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; }

  #feed-title { font-size: 13px; font-weight: 700; color: var(--muted); margin: 6px 0; }
  #feed-list { list-style: none; margin: 0; padding: 0; }
  #feed-list li {
    font-size: 13.5px; padding: 7px 0;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; gap: 8px;
  }
  #feed-list .t { color: var(--muted); font-size: 11px; white-space: nowrap; padding-top: 2px; }

  #error-bar {
    display: none;
    background: rgba(248, 113, 113, 0.12);
    border: 1px solid rgba(248, 113, 113, 0.4);
    color: var(--red);
    font-size: 13px; border-radius: 10px;
    padding: 8px 12px; margin-bottom: 10px;
  }
  #error-bar.show { display: block; }
  #error-bar button {
    background: none; border: 1px solid var(--red); color: var(--red);
    border-radius: 8px; padding: 4px 10px; margin-left: 8px;
    font-size: 12px;
  }
  #hint { color: var(--muted); font-size: 11px; text-align: center; margin-top: 8px; }

  #toast {
    position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%) translateY(-8px);
    background: rgba(10, 12, 20, 0.92);
    border: 1px solid rgba(45, 212, 191, 0.35);
    color: var(--text); font-size: 13px; font-weight: 600;
    padding: 8px 16px; border-radius: 999px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 40; white-space: nowrap; max-width: 92vw;
    overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #room-btns {
    position: fixed; top: calc(14px + env(safe-area-inset-top)); right: 14px;
    display: flex; gap: 6px; z-index: 30;
  }
  .room-btn {
    background: rgba(10, 12, 20, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: var(--text); font-size: 12px; font-weight: 600;
    padding: 7px 12px; border-radius: 999px; cursor: pointer;
  }
  .room-btn.active { border-color: rgba(45, 212, 191, 0.6); color: #2dd4bf; }
</style>
</head>
<body>
  <div id="scene-container"></div>

  <div id="toast"></div>
  <div id="room-btns">
    <button id="btn-kantor" class="room-btn active" type="button">🏢 Kantor</button>
    <button id="btn-rapat" class="room-btn" type="button">📋 Rapat</button>
  </div>
  <div id="loading">⏳ memuat kantor…</div>

  <div id="sheet">
    <div id="sheet-handle"><span></span></div>
    <div id="error-bar">⚠️ <span id="error-text">gagal memuat data.</span><button id="retry-btn" type="button">Coba lagi</button></div>
    <div id="status-card">
      <div>
        <div id="agent-name">Vesper</div>
        <div id="activity-text">menghubungkan…</div>
      </div>
      <span id="state-badge">…</span>
      <span id="updated-text"></span>
    </div>
    <div id="feed-title">aktivitas terakhir</div>
    <ul id="feed-list"></ul>
    <div id="hint">ketuk avatar & perabot buat interaksi • drag untuk muter • cubit untuk zoom • ketuk garis atas buat melipat kolom • sapa Mochi 🍡</div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="js/data.js"></script>
  <script src="js/office.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Guard: kalau Three.js gagal dimuat, jangan biarkan halaman blank misterius.
    (function () {
      if (typeof THREE === "undefined") {
        var el = document.getElementById("loading");
        el.classList.remove("hidden");
        el.textContent = "😢 Three.js gagal dimuat. Coba muat ulang halaman ini.";
      }
    })();
  </script>
</body>
</html>
